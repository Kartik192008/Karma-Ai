services:
  - type: web
    runtime: node
    name: karma-ai-frontend
    rootDir: artifacts/karma-ai
    buildCommand: pnpm install && pnpm run build
    startCommand: node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://karma-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
