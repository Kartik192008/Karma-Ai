services:
  - type: web
    runtime: node
    name: karma-ai-frontend
    rootDir: artifacts/karma-ai
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://karma-ai-backend.onrender.com
