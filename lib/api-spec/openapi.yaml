openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: KARMA AI learning assistant operations
  - name: recommendations
    description: Official iGOT Karmayogi and NSSTA learning recommendations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/chat:
    post:
      operationId: sendGeminiChat
      tags: [gemini]
      summary: Ask KARMA AI a learning question
      description: Sends a learning question and optional uploaded-material context to the Gemini-powered KARMA AI assistant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiChatInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiChatResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mospi-recommendations:
    get:
      operationId: searchMospiDatasets
      tags: [mospi]
      summary: Search official MoSPI datasets
      description: Searches the MoSPI Microdata Portal for datasets relevant to the query. Returns ranked official dataset metadata only.
      parameters:
        - name: query
          in: query
          required: true
          description: Competency, topic, or learning goal to search MoSPI datasets for
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: limit
          in: query
          required: false
          description: Maximum number of dataset results
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        "200":
          description: Official MoSPI dataset recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MospiRecommendationsResponse"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: MoSPI provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /learning-recommendations:
    get:
      operationId: getLearningRecommendations
      tags: [recommendations]
      summary: Find official learning recommendations
      description: Searches the public iGOT Karmayogi course catalogue and NSSTA training catalogue. Results are normalized with an official destination link and source availability is returned explicitly when a catalogue cannot be reached.
      parameters:
        - name: query
          in: query
          required: true
          description: Competency, topic, or learning goal to search for
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: limit
          in: query
          required: false
          description: Maximum number of recommendations to return
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        "200":
          description: Official recommendations and catalogue availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningRecommendationsResponse"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Recommendation provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GeminiChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
      required:
        - role
        - content
    GeminiChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 12000
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/GeminiChatMessage"
        materialText:
          type: ["string", "null"]
          maxLength: 50000
        materialName:
          type: ["string", "null"]
          maxLength: 200
        images:
          type: array
          maxItems: 1
          items:
            type: object
            properties:
              mimeType:
                type: string
              data:
                type: string
            required: []
        provider:
          type: string
        model:
          type: string
      required:
        - message
    GeminiChatResponse:
      type: object
      properties:
        message:
          type: string
        model:
          type: string
        groundedInMaterial:
          type: boolean
        provider:
          type: string
      required:
        - message
        - model
        - groundedInMaterial
    LearningRecommendationsQuery:
      type: object
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 200
        limit:
          type: integer
          minimum: 1
          maximum: 12
          default: 6
      required:
        - query
    RecommendationSource:
      type: object
      properties:
        id:
          type: string
          enum: [igot, nssta]
        name:
          type: string
        status:
          type: string
          enum: [available, unavailable]
        endpoint:
          type: string
          format: uri
        message:
          type: ["string", "null"]
      required:
        - id
        - name
        - status
        - endpoint
        - message
    LearningRecommendation:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
          enum: [igot, nssta]
        sourceName:
          type: string
        title:
          type: string
        summary:
          type: string
        type:
          type: string
          enum: [course, programme]
        relevance:
          type: integer
          minimum: 0
          maximum: 100
        destinationUrl:
          type: string
          format: uri
        provider:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        schedule:
          type: ["string", "null"]
      required:
        - id
        - source
        - sourceName
        - title
        - summary
        - type
        - relevance
        - destinationUrl
        - provider
        - duration
        - schedule
    LearningRecommendationsResponse:
      type: object
      properties:
        query:
          type: string
        catalogueStatus:
          type: string
          enum: [available, partial, unavailable]
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/LearningRecommendation"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationSource"
      required:
        - query
        - catalogueStatus
        - recommendations
        - sources
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MospiDataset:
      type: object
      properties:
        id:
          type: string
        idno:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
      required:
        - id
        - title
    MospiDatasetsResponse:
      type: object
      properties:
        query:
          type: ["string", "null"]
        total:
          type: integer
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/MospiDataset"
      required:
        - total
        - datasets
    MospiRecommendationsResponse:
      type: object
      properties:
        query:
          type: ["string", "null"]
        catalogueStatus:
          type: string
          enum: [available, partial, unavailable]
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/LearningRecommendation"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationSource"
      required:
        - query
        - catalogueStatus
        - recommendations
        - sources

